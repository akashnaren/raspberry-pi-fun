[Service]
# pi4 only. install.sh writes EnvironmentFile= into the user unit and creates
# ~/.config/pi-pair/pi-gpt-api.env at mode 600. Prefer EnvironmentFile= so the
# unit does not contain the key. If you put the key in an Environment= line
# in a drop-in, chmod 600 that drop-in.
EnvironmentFile=%h/.config/pi-pair/pi-gpt-api.env
