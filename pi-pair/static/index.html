<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>OpenPi — MicroAstra</title>
<link rel="stylesheet" href="/static/mesh.css"/>
<script>
try {
  var saved = JSON.parse(localStorage.getItem("openpi.settings") || "{}");
  var theme = saved.theme === "light" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", theme);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f4f4f1" : "#0a0a0a");
} catch (e) {
  document.documentElement.setAttribute("data-theme", "dark");
}
</script>
</head><body>
<div id="banner"></div>
<div class="app flex flex-col min-h-0 w-full">
  <header class="flex items-center justify-between shrink-0">
    <div class="brand" id="brand">
      <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
      <span class="brand-name" id="brandName">OpenPi — MicroAstra</span>
    </div>
    <button class="head-btn" id="btnIo" type="button" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div id="log"><div class="empty" id="empty"><p>Ask anything.</p></div></div>
  <div id="voiceStage" class="voice-stage" aria-hidden="true">
    <div class="voice-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <p class="voice-live" id="voiceLive"></p>
  </div>
  <footer>
    <div class="composer-wrap">
      <p class="voice-note" id="voiceNote" hidden></p>
      <div class="file-tag" id="fileTag"><span id="fileName"></span><button type="button" id="fileClear" aria-label="Remove">×</button></div>
      <div class="composer">
        <textarea id="q" placeholder="Message" rows="1" enterkeyhint="send" aria-label="Message"></textarea>
        <div class="composer-bar flex items-center justify-between">
          <div class="composer-modes flex items-center">
            <div class="mode-menu">
              <button type="button" class="mode-btn" id="modeBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Model mode">
                <span id="modeLabel">Auto</span>
                <svg class="mode-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="mode-pop" id="modePop" role="menu" hidden>
                <button type="button" class="mode-opt on" data-mode="auto" role="menuitemradio" aria-checked="true">
                  <span>Auto</span>
                  <span class="mode-mark" aria-hidden="true">✓</span>
                </button>
                <button type="button" class="mode-opt" data-mode="flash" role="menuitemradio" aria-checked="false">
                  <span>Flash</span>
                  <span class="mode-mark" aria-hidden="true">✓</span>
                </button>
                <button type="button" class="mode-opt" data-mode="pro" role="menuitemradio" aria-checked="false">
                  <span>Pro</span>
                  <span class="mode-mark" aria-hidden="true">✓</span>
                </button>
              </div>
            </div>
            <div class="think-set" role="group" aria-label="Thinking">
              <button type="button" class="think-btn" data-think="low">Low</button>
              <button type="button" class="think-btn on" data-think="medium">Medium</button>
              <button type="button" class="think-btn" data-think="high">High</button>
            </div>
          </div>
          <div class="composer-tools flex items-center">
            <button class="tool" id="btnVoiceMode" type="button" aria-label="Voice mode" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9.5v5M9.5 6v12M14.5 6v12M19 9.5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="tool mic-off" id="btnVoice" type="button" aria-label="Voice" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button class="tool" id="btnAttach" type="button" aria-label="Attach a file">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.5 12.5l6-6a3 3 0 0 1 4.2 4.2l-7.3 7.3a4.5 4.5 0 0 1-6.4-6.4l6.8-6.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="send-btn voice" id="go" type="button" aria-label="Voice mode">
              <svg class="voice-mark" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4M8.5 7v10M12 4.5v15M15.5 7v10M20 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <svg class="send-mark" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="stop-mark" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>
      <input type="file" id="attach" accept=".txt,.md,.markdown,.pdf,.png,.jpg,.jpeg,.gif,.webp,.tif,.tiff,.bmp,text/plain,text/markdown,image/jpeg,image/png,image/gif,image/webp,image/tiff,image/bmp,application/pdf"/>
    </div>
  </footer>
</div>
<div class="overlay" id="overlay"></div>
<aside class="sources-panel" id="sourcesPanel" aria-label="Sources" aria-hidden="true">
  <div class="sources-panel-head">
    <h2>Sources</h2>
    <button type="button" class="drawer-close" id="sourcesClose" aria-label="Close sources">×</button>
  </div>
  <div class="sources-panel-body" id="sourcesBody"></div>
</aside>
<aside class="drawer" id="ioPanel" aria-label="Settings">
  <div class="drawer-head">
    <h2>Settings</h2>
    <button class="drawer-close" id="btnCloseIo" type="button">Close</button>
  </div>
  <div class="drawer-body">
    <section class="set-block">
      <h3>Appearance</h3>
      <div class="seg" role="group" aria-label="Appearance">
        <button type="button" class="seg-btn on" data-theme-choice="dark">Dark</button>
        <button type="button" class="seg-btn" data-theme-choice="light">Light</button>
      </div>
    </section>
    <section class="set-block">
      <h3>Model</h3>
      <div class="seg" role="group" aria-label="Model default">
        <button type="button" class="seg-btn on" data-mode="auto">Auto</button>
        <button type="button" class="seg-btn" data-mode="flash">Flash</button>
        <button type="button" class="seg-btn" data-mode="pro">Pro</button>
      </div>
    </section>
    <section class="set-block">
      <h3>Thinking</h3>
      <div class="seg" role="group" aria-label="Thinking effort">
        <button type="button" class="seg-btn" data-think="low">Low</button>
        <button type="button" class="seg-btn on" data-think="medium">Medium</button>
        <button type="button" class="seg-btn" data-think="high">High</button>
      </div>
    </section>
    <section class="set-block">
      <h3>Voice</h3>
      <label for="voiceSilence">End-of-utterance silence (ms)</label>
      <input id="voiceSilence" type="number" min="0" max="10000" step="50" value="1200" inputmode="numeric"/>
    </section>
    <section class="set-block">
      <h3>Composer</h3>
      <label class="check" for="enterSend"><input id="enterSend" type="checkbox" checked/> Enter to send</label>
    </section>
    <div class="field">
      <label for="sys">System prompt</label>
      <textarea id="sys" placeholder="Optional system instructions" rows="3"></textarea>
    </div>
    <div class="field">
      <label for="modelSel">Installed models</label>
      <select id="modelSel"><option value="">__MODEL__</option></select>
    </div>
    <div class="drawer-actions">
      <button type="button" id="btnMd">Export .md</button>
      <button type="button" id="btnTxt">Export .txt</button>
      <button type="button" class="danger" id="btnClear">Clear conversation</button>
    </div>
  </div>
</aside>
<script>window.MESH_DEFAULT_MODEL="__MODEL__";</script>
<script src="/static/mesh.js"></script></body></html>
