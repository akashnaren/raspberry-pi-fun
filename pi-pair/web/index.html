<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Pi GPT 1.0</title>
<link rel="stylesheet" href="/static/mesh.css"/>
</head><body>
<div id="banner"></div>
<div class="app flex flex-col min-h-0 w-full">
  <header class="flex items-center justify-between shrink-0">
    <div class="brand">Pi GPT 1.0</div>
    <button class="head-btn" id="btnIo" type="button" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div id="log"><div class="empty" id="empty"><p>Ask anything.</p></div></div>
  <div id="voiceStage" class="voice-stage" aria-hidden="true">
    <div class="voice-orb" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="voice-live" id="voiceLive"></p>
  </div>
  <footer>
    <div class="composer-wrap">
      <p class="voice-note" id="voiceNote" hidden></p>
      <div class="file-tag" id="fileTag"><span id="fileName"></span><button type="button" id="fileClear" aria-label="Remove">×</button></div>
      <div class="composer">
        <textarea id="q" placeholder="Message" rows="1" enterkeyhint="send" aria-label="Message"></textarea>
        <div class="composer-bar flex items-center justify-between">
          <div class="think-set" role="group" aria-label="Thinking">
            <button type="button" class="think-btn" data-think="low">Low</button>
            <button type="button" class="think-btn on" data-think="medium">Medium</button>
            <button type="button" class="think-btn" data-think="high">High</button>
          </div>
          <div class="composer-tools flex items-center">
            <button class="tool" id="btnVoiceMode" type="button" aria-label="Voice mode" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M8.2 9.2a5 5 0 0 0 0 5.6M15.8 9.2a5 5 0 0 1 0 5.6M5.4 6.6a9 9 0 0 0 0 10.8M18.6 6.6a9 9 0 0 1 0 10.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <span class="voice-mode-label">End</span>
            </button>
            <button class="tool" id="btnVoice" type="button" aria-label="Voice" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button class="tool" id="btnAttach" type="button" aria-label="Attach">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.5 12.5l6-6a3 3 0 0 1 4.2 4.2l-7.3 7.3a4.5 4.5 0 0 1-6.4-6.4l6.8-6.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="send-btn" id="go" type="button" aria-label="Send">
              <svg class="send-mark" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="stop-mark" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>
      <input type="file" id="attach" accept=".txt,.md,.csv,.json,.log,.py,.js,.ts,.html,.css,.xml,.yaml,.yml,text/plain"/>
    </div>
  </footer>
</div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="ioPanel" aria-label="Settings">
  <div class="drawer-head">
    <h2>Settings</h2>
    <button class="drawer-close" id="btnCloseIo" type="button">Close</button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label for="sys">System prompt</label>
      <textarea id="sys" placeholder="Optional system instructions" rows="3"></textarea>
    </div>
    <div class="field">
      <label for="modelSel">Model</label>
      <select id="modelSel"><option value="">__MODEL__</option></select>
    </div>
    <div class="drawer-actions">
      <button type="button" id="btnMd">Export .md</button>
      <button type="button" id="btnTxt">Export .txt</button>
      <button type="button" class="danger" id="btnClear">Clear chat</button>
    </div>
  </div>
</aside>
<script>window.MESH_DEFAULT_MODEL="__MODEL__";</script>
<script src="/static/mesh.js"></script></body></html>
