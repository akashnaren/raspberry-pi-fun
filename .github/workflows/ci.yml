# Pull-request and non-main branch checks for the Pi flywheel.
# Every job is bound to the GitHub Environment named "development".
# Do not put production SSH secrets on that environment.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.13.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi-pair/web/package-lock.json
      - name: Ruff
        run: |
          ruff check pi-pair
          ruff format --check pi-pair
      - name: Front-end lint
        working-directory: pi-pair/web
        run: npm ci && npm run lint && npm run lint:js
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x pi-pair/install.sh pi-pair/start.sh pi-pair/mesh-hello.sh pi-pair/ci/deploy_pi3.sh pi-pair/ci/restart_pi3.sh pi-pair/ci/pi3_ssh.sh pi-pair/ci/stamp_file.sh

  unit:
    name: unit
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pi-pair/web/package-lock.json
      - name: Build, test, and check the chat page
        working-directory: pi-pair/web
        run: npm ci && npm run build && npm test
      - name: Committed static matches the build
        run: git diff --exit-code -- pi-pair/static
      - name: Python tests
        run: python3 -m unittest discover -s pi-pair/tests -t pi-pair -v

  data-stack:
    name: data-stack
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate canned, SFT, and eval fixtures
        run: python3 pi-pair/ci/validate_data_stack.py --data pi-pair/data --report pi-pair/ci/out/data-stack-report.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-stack-validation-report
          path: pi-pair/ci/out/data-stack-report.json
          if-no-files-found: error
