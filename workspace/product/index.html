<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian Office — Docs</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f7;
        --paper: #ffffff;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        font-family: system-ui, -apple-system, "Segoe UI", "Liberation Sans", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
      body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; }
      header {
        display: flex; align-items: baseline; gap: 1.1rem;
        padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--line);
      }
      nav { display: flex; gap: 0.9rem; font-size: 0.8rem; }
      nav a { color: var(--muted); text-decoration: none; }
      nav a[aria-current="page"] { color: var(--ink); }
      .tools { margin-left: auto; display: flex; gap: 0.7rem; font-size: 0.75rem; }
      .tools button, .tools label {
        border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; padding: 0;
      }
      main { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--paper); }
      #title {
        width: 100%; border: 0; border-bottom: 1px solid var(--line);
        padding: 0.85rem 1.2rem 0.55rem; font: inherit; font-size: 1.35rem; background: transparent;
      }
      #body {
        padding: 0.85rem 1.2rem 1.4rem; outline: none; overflow: auto; line-height: 1.55;
        min-height: 12rem;
      }
      #body:empty::before { content: attr(data-placeholder); color: var(--muted); }
      footer {
        display: flex; justify-content: space-between; gap: 1rem;
        padding: 0.45rem 1.1rem; border-top: 1px solid var(--line);
        color: var(--muted); font-size: 0.72rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Meridian Office">
        <a href="./index.html" aria-current="page">Docs</a>
        <a href="./sheets.html">Sheets</a>
        <a href="./slides.html">Slides</a>
        <a href="./timezone-buddy.html">Timezone Buddy</a>
      </nav>
      <div class="tools">
        <button id="download-txt" type="button">download text</button>
        <button id="download-html" type="button">download html</button>
        <button id="print" type="button">print</button>
      </div>
    </header>
    <main>
      <input id="title" type="text" maxlength="140" value="Untitled" aria-label="Document title" />
      <div id="body" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Start writing. This stays in this tab until you download it."></div>
    </main>
    <footer>
      <span id="count">0 words</span>
      <span>No accounts. Nothing is uploaded. Last green build.</span>
    </footer>
    <script>
      const title = document.getElementById("title");
      const body = document.getElementById("body");
      const count = document.getElementById("count");
      const KEY = "meridian-office-docs";

      function words() {
        const text = body.innerText.replace(/\s+/g, " ").trim();
        return text ? text.split(" ").length : 0;
      }
      function paintCount() {
        const n = words();
        count.textContent = n === 1 ? "1 word" : n + " words";
      }
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify({ title: title.value, html: body.innerHTML }));
        } catch (_) {}
        paintCount();
      }
      function load() {
        try {
          const raw = localStorage.getItem(KEY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (data.title) title.value = data.title;
          if (data.html) body.innerHTML = data.html;
        } catch (_) {}
        paintCount();
      }
      function download(name, type, text) {
        const blob = new Blob([text], { type });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function fileBase() {
        const name = title.value.trim() || "untitled";
        return name.replace(/[^\w\- ]+/g, "").replace(/\s+/g, "-").toLowerCase() || "untitled";
      }
      document.getElementById("download-txt").addEventListener("click", () => {
        download(fileBase() + ".txt", "text/plain", title.value + "\n\n" + body.innerText);
      });
      document.getElementById("download-html").addEventListener("click", () => {
        const html = "<!doctype html><html><head><meta charset=\"utf-8\"><title>" +
          title.value.replace(/</g, "") + "</title></head><body><h1>" +
          title.value.replace(/</g, "") + "</h1>" + body.innerHTML + "</body></html>";
        download(fileBase() + ".html", "text/html", html);
      });
      document.getElementById("print").addEventListener("click", () => window.print());
      title.addEventListener("input", save);
      body.addEventListener("input", save);
      load();
    </script>
  </body>
</html>
