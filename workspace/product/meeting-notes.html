<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes — Meridian Office</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4ecd8;
        --sheet: #faf4e8;
        --ink: #2a2118;
        --muted: #8a7d6b;
        --rule: #e0d4bc;
        --rail: #efe6d2;
        --rail-line: #d8cbb0;
        --ui: system-ui, -apple-system, "Segoe UI", "Liberation Sans", "DejaVu Sans", sans-serif;
        font-family: var(--ui);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
      body { display: grid; grid-template-columns: 6.1rem 1fr; grid-template-rows: auto 1fr auto; min-height: 100dvh; }
      .rail {
        grid-row: 1 / -1; display: flex; flex-direction: column; gap: 0.55rem;
        padding: 0.7rem 0.5rem 0.8rem; background: var(--rail);
        border-right: 1px solid var(--rail-line);
      }
      .brand { font-size: 0.72rem; font-weight: 600; line-height: 1.25; }
      .apps { display: flex; flex-direction: column; gap: 0.15rem; }
      .apps a, .more a {
        color: #6b5d4d; text-decoration: none; font-size: 0.8rem;
        padding: 0.32rem 0.4rem; border-radius: 5px;
      }
      .more { margin-top: auto; padding-top: 0.55rem; border-top: 1px solid var(--rail-line); }
      .more span { display: block; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.04em; margin: 0 0.4rem 0.25rem; }
      .more a { display: block; font-size: 0.68rem; padding: 0.22rem 0.4rem; }
      .more a[aria-current="page"] { color: var(--ink); }
      header {
        display: flex; align-items: baseline; gap: 0.9rem;
        padding: 0.5rem 1rem; border-bottom: 1px solid var(--rule);
      }
      .module { font-size: 0.78rem; color: var(--muted); }
      .tools { margin-left: auto; display: flex; gap: 0.85rem; font-size: 0.72rem; }
      .tools button { border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; padding: 0; }
      .stage { min-height: 0; overflow: auto; padding: 0.8rem 1rem 1.4rem; }
      main { width: min(46rem, 100%); margin: 0 auto; display: grid; gap: 0.7rem; }
      h1 { font-size: 1.15rem; font-weight: 500; margin: 0; }
      .lede { margin: 0; color: var(--muted); font-size: 0.82rem; }
      #notes {
        width: 100%; min-height: 8.5rem; resize: vertical;
        border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
        font: 0.86rem/1.45 "Iowan Old Style", Palatino, "Liberation Serif", Georgia, serif;
        padding: 0.55rem 0.6rem;
      }
      .row { display: flex; gap: 0.8rem; align-items: baseline; }
      .row button { border: 0; background: none; color: var(--ink); font: 0.75rem var(--ui); cursor: pointer; padding: 0; }
      #list {
        background: var(--sheet); border: 1px solid var(--rule);
        padding: 0.7rem 0.9rem 0.85rem; min-height: 8rem;
      }
      #list h2 { font-size: 0.95rem; font-weight: 500; margin: 0 0 0.5rem; }
      #list label { display: flex; gap: 0.5rem; align-items: start; margin: 0 0 0.4rem; font-size: 0.86rem; }
      #list input { margin-top: 0.2rem; }
      #list .who { color: var(--muted); font-size: 0.72rem; }
      footer {
        display: flex; justify-content: space-between; gap: 1rem;
        padding: 0.35rem 1rem; border-top: 1px solid var(--rule);
        color: var(--muted); font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <aside class="rail" aria-label="Meridian Office">
      <div class="brand">Meridian Office</div>
      <nav class="apps" aria-label="Apps">
        <a href="./index.html">Docs</a>
        <a href="./sheets.html">Sheets</a>
        <a href="./slides.html">Slides</a>
      </nav>
      <nav class="more" aria-label="Catalogue">
        <span>CATALOGUE</span>
        <a href="./paste-csv.html">Paste → CSV</a>
        <a href="./invoice.html">Invoice</a>
        <a href="./meeting-notes.html" aria-current="page">Notes</a>
        <a href="./kanban.html">Kanban</a>
        <a href="./units.html">Units</a>
        <a href="./timezone-buddy.html">Timezone Buddy</a>
      </nav>
    </aside>
    <header>
      <span class="module">Notes</span>
      <div class="tools">
        <button id="download-md" type="button">download .md</button>
      </div>
    </header>
    <div class="stage">
      <main>
        <h1>Paste notes. Take a list.</h1>
        <p class="lede">Actions and owners if you named them. Download a checklist. Stays on this machine.</p>
        <textarea id="notes" aria-label="Meeting notes" placeholder="Mira: cut payments.
Nova will ship the invoice.
Action: Kessler check print margins.
Jules to rewrite the board."></textarea>
        <div class="row">
          <button id="extract" type="button">make checklist</button>
          <span id="size">0 actions</span>
        </div>
        <div id="list" aria-label="Action items"></div>
      </main>
    </div>
    <footer>
      <span>Local only. No accounts.</span>
      <span id="kept">Catalogue tool. Not in the app rail.</span>
    </footer>
    <script>
      const KEY = "meridian-office-notes-v1";
      const PEOPLE = [
        { id: "nova", name: "Nova", re: /\bnova\b/i },
        { id: "kessler", name: "Kessler", re: /\bkessler\b/i },
        { id: "mira", name: "Mira", re: /\bmira\b/i },
        { id: "jules", name: "Jules", re: /\bjules\b/i },
      ];
      const notes = document.getElementById("notes");
      const list = document.getElementById("list");
      const size = document.getElementById("size");
      const kept = document.getElementById("kept");
      let actions = [];

      function ownerIn(text) {
        const src = String(text || "");
        for (let i = 0; i < PEOPLE.length; i += 1) {
          if (PEOPLE[i].re.test(src)) return PEOPLE[i];
        }
        return null;
      }
      function cleanLine(raw) {
        return String(raw || "").trim().replace(/^[-*•]\s+/, "").replace(/^\[[\sxX]\]\s+/, "");
      }
      function extractActions(text) {
        const out = [];
        const seen = {};
        const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
        for (let i = 0; i < lines.length; i += 1) {
          const line = cleanLine(lines[i]);
          if (!line) continue;
          let body = line;
          let forced = false;
          const tagged = /^(?:action|todo|task)\s*[:—-]\s*(.+)$/i.exec(line);
          if (tagged) { body = tagged[1].trim(); forced = true; }
          const will = /^(\w+)\s+(?:will|should|needs to|to)\s+(.+)$/i.exec(body);
          const said = /^(\w+)\s*:\s+(.+)$/i.exec(body);
          let owner = ownerIn(body);
          if (will && ownerIn(will[1])) {
            owner = ownerIn(will[1]);
            body = will[2].trim();
            forced = true;
          } else if (said && ownerIn(said[1]) && /^(cut|ship|file|check|rewrite|move|print|fix|keep|write|add|remove|pair)\b/i.test(said[2])) {
            owner = ownerIn(said[1]);
            body = said[2].trim();
            forced = true;
          }
          const looks = forced ||
            /^(ship|file|cut|check|rewrite|move|print|fix|keep|write|add|remove|pair)\b/i.test(body) ||
            /\b(will|should|needs to|todo|action)\b/i.test(line);
          if (!looks) continue;
          body = body.replace(/[.]+$/, "").trim();
          if (!body) continue;
          const key = (owner ? owner.id : "") + ":" + body.toLowerCase();
          if (seen[key]) continue;
          seen[key] = true;
          out.push({ text: body, owner: owner ? owner.name : "", ownerId: owner ? owner.id : "", done: false });
        }
        return out;
      }
      function actionsMarkdown(items, title) {
        const lines = ["# " + (title || "Action items"), ""];
        if (!items.length) lines.push("- [ ] (none yet)");
        for (let i = 0; i < items.length; i += 1) {
          const box = items[i].done ? "- [x] " : "- [ ] ";
          lines.push(box + items[i].text + (items[i].owner ? " (" + items[i].owner + ")" : ""));
        }
        return lines.join("\n") + "\n";
      }
      function escapeHtml(value) {
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function paint() {
        size.textContent = actions.length === 1 ? "1 action" : actions.length + " actions";
        if (!actions.length) {
          list.innerHTML = "<h2>Action items</h2><p class=\"who\">Nothing yet. Paste notes, then make a checklist.</p>";
          return;
        }
        let html = "<h2>Action items</h2>";
        for (let i = 0; i < actions.length; i += 1) {
          html += "<label><input type=\"checkbox\" data-i=\"" + i + "\"" + (actions[i].done ? " checked" : "") +
            " /><span>" + escapeHtml(actions[i].text) +
            (actions[i].owner ? " <span class=\"who\">" + escapeHtml(actions[i].owner) + "</span>" : "") +
            "</span></label>";
        }
        list.innerHTML = html;
      }
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify({ text: notes.value, actions: actions, savedAt: Date.now() }));
        } catch (err) {}
        kept.textContent = "Kept locally just now.";
      }
      function extract() {
        const prev = {};
        for (let i = 0; i < actions.length; i += 1) {
          prev[(actions[i].ownerId || "") + ":" + actions[i].text.toLowerCase()] = actions[i].done;
        }
        actions = extractActions(notes.value).map(function (item) {
          const key = (item.ownerId || "") + ":" + item.text.toLowerCase();
          item.done = Boolean(prev[key]);
          return item;
        });
        paint();
        save();
      }
      document.getElementById("extract").addEventListener("click", extract);
      document.getElementById("download-md").addEventListener("click", function () {
        if (!actions.length) extract();
        const blob = new Blob([actionsMarkdown(actions, "Action items")], { type: "text/markdown;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "action-items.md";
        a.click();
        URL.revokeObjectURL(a.href);
      });
      list.addEventListener("change", function (event) {
        const box = event.target.closest("input[data-i]");
        if (!box) return;
        const i = Number(box.dataset.i);
        if (!actions[i]) return;
        actions[i].done = box.checked;
        save();
      });
      notes.addEventListener("input", function () {
        if (actions.length) extract();
        else {
          try { localStorage.setItem(KEY, JSON.stringify({ text: notes.value, actions: [], savedAt: Date.now() })); } catch (err) {}
        }
      });
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (data.text) notes.value = data.text;
          if (Array.isArray(data.actions)) actions = data.actions;
        }
      } catch (err) {}
      paint();
    </script>
  </body>
</html>
