<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian Office — Slides</title>
    <style>
      :root {
        color-scheme: dark;
        --chrome: #1c1916; --paper: #f3ead7; --ink: #2a2118; --line: #3a322b;
        font-family: system-ui, -apple-system, "Segoe UI", "Liberation Sans", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--chrome); color: #e8dfd2; }
      body { display: grid; grid-template-rows: auto 1fr; min-height: 100dvh; }
      header {
        display: flex; gap: 1.1rem; align-items: baseline;
        padding: 0.55rem 1rem; border-bottom: 1px solid var(--line);
      }
      .brand { font-size: 0.78rem; }
      nav { display: flex; gap: 0.85rem; font-size: 0.78rem; }
      nav a { color: #9a8f80; text-decoration: none; }
      nav a[aria-current="page"] { color: #f3ead7; }
      main { padding: 1.1rem 1.2rem 1.4rem; background: var(--paper); color: var(--ink); }
      h1 { font-size: 1.05rem; font-weight: 500; margin: 0 0 0.3rem; }
      p { color: #5c5348; line-height: 1.5; max-width: 34rem; margin: 0 0 1rem; font-size: 0.92rem; }
      .row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
      .deck {
        aspect-ratio: 16/9; width: min(100%, 18rem);
        border: 1px solid #d8cbb0; background: #fff8ea;
        padding: 1rem 1.1rem; color: #2a2118;
      }
      .deck strong { display: block; font-size: 1.05rem; font-weight: 500; margin-bottom: 0.35rem; }
      .deck span { color: #5c5348; font-size: 0.82rem; }
      .deck.ghost { opacity: 0.55; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Meridian Office</span>
      <nav>
        <a href="./index.html">Docs</a>
        <a href="./sheets.html">Sheets</a>
        <a href="./slides.html" aria-current="page">Slides</a>
      </nav>
    </header>
    <main>
      <h1>Slides after the page can hold a thought</h1>
      <p>One title card so the pane is not a blank rectangle. A deck waits until Docs is done. No accounts.</p>
      <div class="row">
        <div class="deck" aria-hidden="true">
          <strong>Meridian Office</strong>
          <span>Docs first. Local only.</span>
        </div>
        <div class="deck ghost" aria-hidden="true">
          <strong>Next</strong>
          <span>One thought per page. After Docs.</span>
        </div>
      </div>
    </main>
  </body>
</html>
