<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian Office — Slides</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7;
        font-family: system-ui, -apple-system, "Segoe UI", "Liberation Sans", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); }
      header {
        display: flex; gap: 1.1rem; align-items: baseline;
        padding: 0.7rem 1.1rem; border-bottom: 1px solid var(--line);
      }
      nav { display: flex; gap: 0.9rem; font-size: 0.8rem; }
      nav a { color: var(--muted); text-decoration: none; }
      nav a[aria-current="page"] { color: var(--ink); }
      main { padding: 2.2rem 1.2rem; max-width: 34rem; }
      h1 { font-size: 1.2rem; font-weight: 500; margin: 0 0 0.4rem; }
      p { color: var(--muted); line-height: 1.5; }
      .deck {
        margin-top: 1.4rem; aspect-ratio: 16/9; max-width: 22rem;
        border: 1px solid var(--line); background: #fff; opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="./index.html">Docs</a>
        <a href="./sheets.html">Sheets</a>
        <a href="./slides.html" aria-current="page">Slides</a>
        <a href="./timezone-buddy.html">Timezone Buddy</a>
      </nav>
    </header>
    <main>
      <h1>Slides after the page can hold a thought</h1>
      <p>One empty rectangle is not a product. Come back when Docs is done.</p>
      <div class="deck" aria-hidden="true"></div>
    </main>
  </body>
</html>
