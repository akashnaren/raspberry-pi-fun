<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban — Meridian Office</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4ecd8;
        --sheet: #faf4e8;
        --ink: #2a2118;
        --muted: #8a7d6b;
        --rule: #e0d4bc;
        --rail: #efe6d2;
        --rail-line: #d8cbb0;
        --ui: system-ui, -apple-system, "Segoe UI", "Liberation Sans", "DejaVu Sans", sans-serif;
        font-family: var(--ui);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
      body { display: grid; grid-template-columns: 6.1rem 1fr; grid-template-rows: auto 1fr auto; min-height: 100dvh; }
      .rail {
        grid-row: 1 / -1; display: flex; flex-direction: column; gap: 0.55rem;
        padding: 0.7rem 0.5rem 0.8rem; background: var(--rail);
        border-right: 1px solid var(--rail-line);
      }
      .brand { font-size: 0.72rem; font-weight: 600; line-height: 1.25; }
      .apps { display: flex; flex-direction: column; gap: 0.15rem; }
      .apps a, .more a {
        color: #6b5d4d; text-decoration: none; font-size: 0.8rem;
        padding: 0.32rem 0.4rem; border-radius: 5px;
      }
      .more { margin-top: auto; padding-top: 0.55rem; border-top: 1px solid var(--rail-line); }
      .more span { display: block; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.04em; margin: 0 0.4rem 0.25rem; }
      .more a { display: block; font-size: 0.68rem; padding: 0.22rem 0.4rem; }
      .more a[aria-current="page"] { color: var(--ink); }
      header {
        display: flex; align-items: baseline; gap: 0.9rem;
        padding: 0.5rem 1rem; border-bottom: 1px solid var(--rule);
      }
      .module { font-size: 0.78rem; color: var(--muted); }
      .tools { margin-left: auto; display: flex; gap: 0.85rem; font-size: 0.72rem; }
      .tools button { border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; padding: 0; }
      .stage { min-height: 0; overflow: auto; padding: 0.8rem 1rem 1.4rem; }
      main { width: min(52rem, 100%); margin: 0 auto; }
      h1 { font-size: 1.15rem; font-weight: 500; margin: 0; }
      .lede { margin: 0.25rem 0 0.8rem; color: var(--muted); font-size: 0.82rem; }
      #board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.55rem; }
      section[data-column] {
        background: var(--sheet); border: 1px solid var(--rule);
        padding: 0.55rem 0.55rem 0.65rem; min-height: 16rem;
        display: flex; flex-direction: column; gap: 0.4rem;
      }
      section[data-column].over { outline: 1px solid #8a7d6b; }
      section h2 { margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
      .cards { display: flex; flex-direction: column; gap: 0.4rem; min-height: 2rem; flex: 1; }
      .empty { margin: 0; color: var(--muted); font-size: 0.75rem; }
      .card {
        background: #fffdf8; border: 1px solid var(--rule); padding: 0.4rem 0.45rem 0.35rem;
        cursor: grab;
      }
      .card input {
        width: 100%; border: 0; background: transparent; color: var(--ink);
        font: 0.86rem/1.35 var(--ui); padding: 0;
      }
      .moves { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.3rem; }
      .moves button, .add button {
        border: 0; background: none; color: #6b5d4d; font: 0.68rem var(--ui); cursor: pointer; padding: 0;
      }
      .add { display: flex; gap: 0.4rem; align-items: center; }
      .add input {
        flex: 1; min-width: 0; border: 0; border-bottom: 1px solid var(--rule);
        background: transparent; color: var(--ink); font: 0.78rem var(--ui); padding: 0.15rem 0;
      }
      footer {
        display: flex; justify-content: space-between; gap: 1rem;
        padding: 0.35rem 1rem; border-top: 1px solid var(--rule);
        color: var(--muted); font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <aside class="rail" aria-label="Meridian Office">
      <div class="brand">Meridian Office</div>
      <nav class="apps" aria-label="Apps">
        <a href="./index.html">Docs</a>
        <a href="./sheets.html">Sheets</a>
        <a href="./slides.html">Slides</a>
      </nav>
      <nav class="more" aria-label="Catalogue">
        <span>CATALOGUE</span>
        <a href="./paste-csv.html">Paste → CSV</a>
        <a href="./invoice.html">Invoice</a>
        <a href="./meeting-notes.html">Notes</a>
        <a href="./kanban.html" aria-current="page">Kanban</a>
        <a href="./units.html">Units</a>
        <a href="./timezone-buddy.html">Timezone Buddy</a>
      </nav>
    </aside>
    <header>
      <span class="module">Kanban</span>
      <div class="tools">
        <button id="download-md" type="button">download .md</button>
        <button id="download-json" type="button">download .json</button>
      </div>
    </header>
    <div class="stage">
      <main>
        <h1>Three columns</h1>
        <p class="lede">Add a card. Rename it. Drag it, or use the move links. Stays on this machine.</p>
        <div id="board">
          <section data-column="backlog" aria-label="Backlog">
            <h2>Backlog</h2>
            <div class="cards"></div>
            <div class="add">
              <input aria-label="New backlog card" placeholder="card" />
              <button type="button" data-add="backlog">add</button>
            </div>
          </section>
          <section data-column="doing" aria-label="Doing">
            <h2>Doing</h2>
            <div class="cards"></div>
            <div class="add">
              <input aria-label="New doing card" placeholder="card" />
              <button type="button" data-add="doing">add</button>
            </div>
          </section>
          <section data-column="done" aria-label="Done">
            <h2>Done</h2>
            <div class="cards"></div>
            <div class="add">
              <input aria-label="New done card" placeholder="card" />
              <button type="button" data-add="done">add</button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <footer>
      <span>Local only. No accounts.</span>
      <span>Catalogue tool. Not in the app rail.</span>
    </footer>
    <script>
      var COLUMNS = ["backlog", "doing", "done"];
      var HEADS = { backlog: "Backlog", doing: "Doing", done: "Done" };

      function emptyBoard() {
        return { seq: 0, columns: { backlog: [], doing: [], done: [] } };
      }
      function addCard(board, column, title) {
        var text = String(title == null ? "" : title).trim();
        if (!text || COLUMNS.indexOf(column) < 0) return board;
        var seq = (Number(board.seq) || 0) + 1;
        var columns = {};
        for (var i = 0; i < COLUMNS.length; i += 1) columns[COLUMNS[i]] = board.columns[COLUMNS[i]].slice();
        columns[column].push({ id: "c" + seq, title: text });
        return { seq: seq, columns: columns };
      }
      function renameCard(board, id, title) {
        var text = String(title == null ? "" : title).trim();
        if (!text) return board;
        var columns = {};
        var found = false;
        for (var i = 0; i < COLUMNS.length; i += 1) {
          var name = COLUMNS[i];
          columns[name] = board.columns[name].map(function (card) {
            if (card.id !== id) return card;
            found = true;
            return { id: card.id, title: text };
          });
        }
        if (!found) return board;
        return { seq: board.seq, columns: columns };
      }
      function moveCard(board, id, toColumn, index) {
        if (COLUMNS.indexOf(toColumn) < 0) return board;
        var card = null;
        var columns = {};
        for (var i = 0; i < COLUMNS.length; i += 1) {
          var name = COLUMNS[i];
          columns[name] = [];
          for (var j = 0; j < board.columns[name].length; j += 1) {
            var item = board.columns[name][j];
            if (item.id === id) card = item;
            else columns[name].push(item);
          }
        }
        if (!card) return board;
        var dest = columns[toColumn];
        var at = dest.length;
        if (index != null && Number.isFinite(Number(index))) {
          at = Math.max(0, Math.min(dest.length, Number(index)));
        }
        dest.splice(at, 0, card);
        return { seq: board.seq, columns: columns };
      }
      function boardMarkdown(board) {
        var lines = ["# Kanban", ""];
        for (var i = 0; i < COLUMNS.length; i += 1) {
          var name = COLUMNS[i];
          lines.push("## " + HEADS[name]);
          var cards = board.columns[name];
          if (!cards.length) lines.push("- (empty)");
          else for (var j = 0; j < cards.length; j += 1) lines.push("- " + cards[j].title);
          lines.push("");
        }
        return lines.join("\n").trim() + "\n";
      }
      function boardJson(board) {
        return JSON.stringify({ columns: board.columns }, null, 2) + "\n";
      }
      function boot() {
        var KEY = "meridian-office-kanban-v1";
        var board = emptyBoard();
        var root = document.getElementById("board");
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.columns && data.columns.backlog && data.columns.doing && data.columns.done) {
              board = { seq: Number(data.seq) || 0, columns: data.columns };
            }
          }
        } catch (err) {}
        function save() {
          try { localStorage.setItem(KEY, JSON.stringify(board)); } catch (err) {}
        }
        function download(name, type, text) {
          var blob = new Blob([text], { type: type });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = name;
          a.click();
          URL.revokeObjectURL(a.href);
        }
        function paint() {
          var sections = root.querySelectorAll("section[data-column]");
          for (var s = 0; s < sections.length; s += 1) {
            var section = sections[s];
            var name = section.getAttribute("data-column");
            var list = section.querySelector(".cards");
            list.replaceChildren();
            var cards = board.columns[name] || [];
            if (!cards.length) {
              var empty = document.createElement("p");
              empty.className = "empty";
              empty.textContent = "(empty)";
              list.appendChild(empty);
            }
            for (var i = 0; i < cards.length; i += 1) {
              var card = cards[i];
              var el = document.createElement("article");
              el.className = "card";
              el.draggable = true;
              el.setAttribute("data-id", card.id);
              var input = document.createElement("input");
              input.value = card.title;
              input.setAttribute("aria-label", "Card title");
              input.setAttribute("data-rename", card.id);
              el.appendChild(input);
              var moves = document.createElement("div");
              moves.className = "moves";
              for (var c = 0; c < COLUMNS.length; c += 1) {
                if (COLUMNS[c] === name) continue;
                var btn = document.createElement("button");
                btn.type = "button";
                btn.setAttribute("data-to", COLUMNS[c]);
                btn.textContent = HEADS[COLUMNS[c]];
                moves.appendChild(btn);
              }
              el.appendChild(moves);
              list.appendChild(el);
            }
          }
        }
        root.addEventListener("click", function (event) {
          var move = event.target.closest("[data-to]");
          if (move) {
            var card = event.target.closest("[data-id]");
            if (!card) return;
            board = moveCard(board, card.getAttribute("data-id"), move.getAttribute("data-to"));
            save();
            paint();
            return;
          }
          var add = event.target.closest("[data-add]");
          if (!add) return;
          var field = add.parentNode.querySelector("input");
          board = addCard(board, add.getAttribute("data-add"), field.value);
          field.value = "";
          save();
          paint();
        });
        root.addEventListener("change", function (event) {
          var input = event.target.closest("[data-rename]");
          if (!input) return;
          board = renameCard(board, input.getAttribute("data-rename"), input.value);
          save();
          paint();
        });
        root.addEventListener("dragstart", function (event) {
          var card = event.target.closest("[data-id]");
          if (!card || !event.dataTransfer) return;
          event.dataTransfer.setData("text/plain", card.getAttribute("data-id"));
          event.dataTransfer.effectAllowed = "move";
        });
        root.addEventListener("dragover", function (event) {
          var col = event.target.closest("[data-column]");
          if (!col) return;
          event.preventDefault();
          col.classList.add("over");
        });
        root.addEventListener("dragleave", function (event) {
          var col = event.target.closest("[data-column]");
          if (col) col.classList.remove("over");
        });
        root.addEventListener("drop", function (event) {
          var col = event.target.closest("[data-column]");
          if (!col || !event.dataTransfer) return;
          event.preventDefault();
          col.classList.remove("over");
          var id = event.dataTransfer.getData("text/plain");
          if (!id) return;
          board = moveCard(board, id, col.getAttribute("data-column"));
          save();
          paint();
        });
        document.getElementById("download-md").addEventListener("click", function () {
          download("kanban.md", "text/markdown;charset=utf-8", boardMarkdown(board));
        });
        document.getElementById("download-json").addEventListener("click", function () {
          download("kanban.json", "application/json;charset=utf-8", boardJson(board));
        });
        paint();
      }
      if (typeof document !== "undefined") boot();
    </script>
  </body>
</html>
