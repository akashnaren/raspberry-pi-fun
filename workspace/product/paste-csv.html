<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paste → CSV — Meridian Office</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4ecd8;
        --sheet: #faf4e8;
        --ink: #2a2118;
        --muted: #8a7d6b;
        --rule: #e0d4bc;
        --rail: #efe6d2;
        --rail-line: #d8cbb0;
        --ui: system-ui, -apple-system, "Segoe UI", "Liberation Sans", "DejaVu Sans", sans-serif;
        font-family: var(--ui);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
      body { display: grid; grid-template-columns: 6.1rem 1fr; grid-template-rows: auto 1fr auto; min-height: 100dvh; }
      .rail {
        grid-row: 1 / -1; display: flex; flex-direction: column; gap: 0.55rem;
        padding: 0.7rem 0.5rem 0.8rem; background: var(--rail);
        border-right: 1px solid var(--rail-line);
      }
      .brand { font-size: 0.72rem; font-weight: 600; line-height: 1.25; }
      .apps { display: flex; flex-direction: column; gap: 0.15rem; }
      .apps a, .more a {
        color: #6b5d4d; text-decoration: none; font-size: 0.8rem;
        padding: 0.32rem 0.4rem; border-radius: 5px;
      }
      .more { margin-top: auto; padding-top: 0.55rem; border-top: 1px solid var(--rail-line); }
      .more span { display: block; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.04em; margin: 0 0.4rem 0.25rem; }
      .more a { display: block; font-size: 0.68rem; padding: 0.22rem 0.4rem; }
      .more a[aria-current="page"] { color: var(--ink); }
      header {
        display: flex; align-items: baseline; gap: 0.9rem;
        padding: 0.5rem 1rem; border-bottom: 1px solid var(--rule);
      }
      .module { font-size: 0.78rem; color: var(--muted); }
      .tools { margin-left: auto; display: flex; gap: 0.85rem; font-size: 0.72rem; }
      .tools button { border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; padding: 0; }
      .stage { min-height: 0; overflow: auto; padding: 0.8rem 1rem 1.4rem; }
      main {
        width: min(46rem, 100%); margin: 0 auto; display: grid; gap: 0.7rem;
      }
      h1 { font-size: 1.15rem; font-weight: 500; margin: 0; }
      .lede { margin: 0; color: var(--muted); font-size: 0.82rem; }
      #messy {
        width: 100%; min-height: 8.5rem; resize: vertical;
        border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
        font: 0.8rem/1.4 ui-monospace, "Liberation Mono", monospace;
        padding: 0.55rem 0.6rem;
      }
      .row { display: flex; gap: 0.8rem; align-items: baseline; }
      .row button { border: 0; background: none; color: var(--ink); font: 0.75rem var(--ui); cursor: pointer; padding: 0; }
      .preview {
        background: var(--sheet); border: 1px solid var(--rule);
        overflow: auto; max-height: 16rem;
      }
      table { border-collapse: collapse; width: 100%; font-size: 0.78rem; }
      th, td { border: 1px solid var(--rule); padding: 0.28rem 0.4rem; text-align: left; }
      th { background: #efe6d2; font-weight: 500; color: #5c5348; }
      td { background: #faf4e8; }
      footer {
        display: flex; justify-content: space-between; gap: 1rem;
        padding: 0.35rem 1rem; border-top: 1px solid var(--rule);
        color: var(--muted); font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <aside class="rail" aria-label="Meridian Office">
      <div class="brand">Meridian Office</div>
      <nav class="apps" aria-label="Apps">
        <a href="./index.html">Docs</a>
        <a href="./sheets.html">Sheets</a>
        <a href="./slides.html">Slides</a>
      </nav>
      <nav class="more" aria-label="Catalogue">
        <span>CATALOGUE</span>
        <a href="./paste-csv.html" aria-current="page">Paste → CSV</a>
        <a href="./timezone-buddy.html">Timezone Buddy</a>
      </nav>
    </aside>
    <header>
      <span class="module">Paste → CSV</span>
      <div class="tools">
        <button id="download-csv" type="button">download .csv</button>
      </div>
    </header>
    <div class="stage">
      <main>
        <h1>Tidy a messy table</h1>
        <p class="lede">Paste TSV, CSV, or space-ish columns. Preview, then take a file. Stays on this machine.</p>
        <textarea id="messy" aria-label="Messy paste" placeholder="name    city    note
Nova    desk    ships Docs
Kessler table   files a bug"></textarea>
        <div class="row">
          <button id="tidy" type="button">tidy preview</button>
          <span id="size">0 rows</span>
        </div>
        <div class="preview" id="preview" aria-label="Tidy preview"></div>
      </main>
    </div>
    <footer>
      <span>Local only. No accounts.</span>
      <span id="kept">Catalogue tool. Not in the app rail.</span>
    </footer>
    <script>
      const messy = document.getElementById("messy");
      const preview = document.getElementById("preview");
      const size = document.getElementById("size");
      const kept = document.getElementById("kept");
      let rows = [];

      function detectDelimiter(text) {
        const src = String(text || "");
        if (src.includes("\t")) return "\t";
        const lines = src.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(function (line) { return line.trim(); });
        if (!lines.length) return ",";
        const commas = lines.map(function (line) { return (line.match(/,/g) || []).length; });
        const spaces = lines.filter(function (line) { return /\s\s+/.test(line); }).length;
        if (Math.max.apply(null, commas) > 0 && spaces < lines.length / 2) return ",";
        if (spaces > 0) return "spaces";
        const singles = lines.map(function (line) { return line.trim().split(/\s+/).length; });
        if (singles.every(function (n) { return n > 1; }) && new Set(singles).size === 1) return "space";
        return ",";
      }
      function parseQuoted(src, delim) {
        const out = [];
        let row = [], cell = "", quoted = false;
        for (let i = 0; i < src.length; i += 1) {
          const ch = src[i];
          if (quoted) {
            if (ch === "\"") {
              if (src[i + 1] === "\"") { cell += "\""; i += 1; }
              else quoted = false;
            } else cell += ch;
            continue;
          }
          if (ch === "\"") { quoted = true; continue; }
          if (ch === delim) { row.push(cell); cell = ""; continue; }
          if (ch === "\n") { row.push(cell); out.push(row); row = []; cell = ""; continue; }
          cell += ch;
        }
        row.push(cell);
        if (row.some(function (v) { return v !== ""; }) || !out.length) out.push(row);
        return out;
      }
      function tidyRows(text) {
        const src = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
        if (!src.trim()) return [];
        const delim = detectDelimiter(src);
        const raw = delim === "\t" || delim === ","
          ? parseQuoted(src, delim)
          : src.split("\n").map(function (line) {
              const trimmed = line.trim();
              if (!trimmed) return [];
              return trimmed.split(delim === "spaces" ? /\s\s+/ : /\s+/);
            });
        const width = raw.reduce(function (max, row) { return Math.max(max, row.length); }, 0);
        return raw.map(function (row) {
          const next = row.map(function (cell) { return String(cell || "").trim(); });
          while (next.length < width) next.push("");
          return next;
        }).filter(function (row) { return row.some(function (cell) { return cell !== ""; }); });
      }
      function toCsv(grid) {
        return grid.map(function (row) {
          return row.map(function (value) {
            const text = String(value || "");
            if (text.indexOf(",") >= 0 || text.indexOf("\"") >= 0 || text.indexOf("\n") >= 0) {
              return "\"" + text.split("\"").join("\"\"") + "\"";
            }
            return text;
          }).join(",");
        }).join("\n");
      }
      function escapeHtml(value) {
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function paint() {
        rows = tidyRows(messy.value);
        size.textContent = rows.length === 1 ? "1 row" : rows.length + " rows";
        if (!rows.length) { preview.innerHTML = ""; return; }
        let html = "<table><thead><tr>";
        for (let c = 0; c < rows[0].length; c += 1) html += "<th>" + String.fromCharCode(65 + c) + "</th>";
        html += "</tr></thead><tbody>";
        for (let r = 0; r < rows.length; r += 1) {
          html += "<tr>";
          for (let c = 0; c < rows[r].length; c += 1) html += "<td>" + escapeHtml(rows[r][c]) + "</td>";
          html += "</tr>";
        }
        preview.innerHTML = html + "</tbody></table>";
      }
      document.getElementById("tidy").addEventListener("click", function () {
        paint();
        kept.textContent = "Tidy preview. Download when you want a file.";
      });
      document.getElementById("download-csv").addEventListener("click", function () {
        paint();
        const blob = new Blob([toCsv(rows) + "\n"], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "tidy.csv";
        a.click();
        URL.revokeObjectURL(a.href);
      });
      messy.addEventListener("input", function () {
        if (preview.innerHTML) paint();
      });
    </script>
  </body>
</html>
