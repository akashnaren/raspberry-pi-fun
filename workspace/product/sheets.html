<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian Office — Sheets</title>
    <style>
      :root {
        color-scheme: dark;
        --chrome: #1c1916; --paper: #f3ead7; --ink: #2a2118; --muted: #8a7d6b; --line: #3a322b;
        font-family: system-ui, -apple-system, "Segoe UI", "Liberation Sans", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--chrome); color: #e8dfd2; }
      body { display: grid; grid-template-rows: auto 1fr; min-height: 100dvh; }
      header {
        display: flex; gap: 1.1rem; align-items: baseline;
        padding: 0.65rem 1rem; border-bottom: 1px solid var(--line);
      }
      .brand { font-size: 0.78rem; }
      nav { display: flex; gap: 0.85rem; font-size: 0.78rem; }
      nav a { color: #9a8f80; text-decoration: none; }
      nav a[aria-current="page"] { color: #f3ead7; }
      main { padding: 2rem 1.2rem; background: var(--paper); color: var(--ink); }
      h1 { font-size: 1.15rem; font-weight: 500; margin: 0 0 0.4rem; }
      p { color: #5c5348; line-height: 1.5; max-width: 32rem; }
      table { border-collapse: collapse; margin-top: 1.4rem; width: min(100%, 22rem); opacity: 0.4; }
      td { border: 1px solid #d8cbb0; height: 1.7rem; width: 25%; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Meridian Office</span>
      <nav>
        <a href="./index.html">Docs</a>
        <a href="./sheets.html" aria-current="page">Sheets</a>
        <a href="./slides.html">Slides</a>
      </nav>
    </header>
    <main>
      <h1>Sheets later</h1>
      <p>Numbers wait until Docs is something a person would actually keep open. No grid to fake, no accounts to collect.</p>
      <table aria-hidden="true"><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></table>
    </main>
  </body>
</html>
