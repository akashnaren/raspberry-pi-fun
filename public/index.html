<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office</title>
    <link rel="stylesheet" href="/office.css" />
  </head>
  <body>
    <header class="hud" aria-label="studio status">
      <p class="status" id="status-line">
        <span id="day-n">Day 1</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="staff-count">4 people</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="budget">$0.00 / $5</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="acting">waiting</span>
      </p>
      <div class="hud-tools">
        <span id="mode-badge">dry-run</span>
        <span id="sleep-badge" class="hidden">asleep</span>
        <button id="sound-btn" type="button" aria-pressed="false" title="Optional. Off by default.">sound off</button>
        <span id="pause-badge" class="hidden" aria-live="polite">paused</span>
        <button id="pause-btn" type="button" class="kill" title="Pause the world. Does not delete the log." aria-label="Pause the office">pause</button>
      </div>
    </header>
    <main class="split">
      <section class="pane office-pane" id="office-pane" aria-label="Office">
        <p id="building-pulse" class="note hidden">writing</p>
        <p id="pause-note" class="note hidden">paused — replay</p>
        <aside id="inspect" class="inspect hidden">
          <strong id="inspect-title"></strong>
          <code id="inspect-model" class="inspect-model"></code>
          <p id="inspect-body"></p>
        </aside>
        <canvas id="office" width="720" height="640"></canvas>
        <p id="event-line" class="event-line">the room is still</p>
      </section>
      <section class="pane product-pane" aria-label="Last green build">
        <div class="product-bar">
          <span id="product-title">Meridian Office</span>
          <a id="open-product" href="/dist/" target="_blank" rel="noopener">open</a>
        </div>
        <iframe id="product" title="Meridian Office" src="/dist/index.html" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe>
      </section>
    </main>
    <iframe id="validator" class="hidden-frame" title="build validator" sandbox="allow-scripts allow-same-origin"></iframe>
    <script src="/office.js" type="module"></script>
  </body>
</html>
